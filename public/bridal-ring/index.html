<!DOCTYPE html>
<!-- @version v0001 | 2026-09-24 | メモリード ブライダルリング 申込フォーム | /public/bridal-ring/ -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="version" content="v0001">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ブライダルリング お申し込みフォーム｜メモリード</title>
<!-- Google Tag Manager -->
<script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);})(window,document,'script','dataLayer','GTM-KG9CZ8Q4');</script>
<style>
  :root{
    --ink:#1a1714; --ink-soft:#4a423b; --paper:#f6f2ea; --paper-2:#efe8db;
    --line:#d8cdb9; --accent:#7c1f2a; --accent-2:#a8894e; --ok:#2f5d3a; --maxw:760px;
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);background:var(--paper);font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium",system-ui,sans-serif;line-height:1.75;font-feature-settings:"palt"}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}
  header.hero{padding:64px 0 34px;border-bottom:1px solid var(--line)}
  .hero .eyebrow{font-size:12px;letter-spacing:.32em;color:var(--accent-2);margin:0 0 16px}
  .hero h1{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-weight:600;font-size:clamp(26px,5.4vw,40px);line-height:1.32;margin:0 0 18px}
  .hero p.lead{margin:0;color:var(--ink-soft);font-size:15px;max-width:56ch}
  main{padding:40px 0 90px}
  .step{margin:0 0 46px}
  .step-head{display:flex;align-items:baseline;gap:14px;margin:0 0 20px}
  .step-no{font-family:"Yu Mincho",serif;color:var(--accent);font-size:15px;letter-spacing:.14em}
  .step-head h2{font-size:19px;margin:0;font-weight:600}
  label.field,div.field{display:block;margin:0 0 18px}
  .field .lb{display:flex;align-items:center;gap:9px;font-size:13.5px;margin:0 0 7px;font-weight:600}
  .req{font-size:10.5px;color:#fff;background:var(--accent);border-radius:3px;padding:2px 6px;font-weight:600}
  .opt{font-size:10.5px;color:var(--ink-soft);border:1px solid var(--line);border-radius:3px;padding:1px 6px;font-weight:400}
  input[type=text],input[type=tel],input[type=email],select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#fffdf9;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:38px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,31,42,.10)}
  textarea{min-height:120px;resize:vertical}
  .hint{font-size:12px;color:var(--ink-soft);margin:6px 0 0}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .row-zip{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
  .btn-zip{white-space:nowrap;font:inherit;font-size:13px;font-weight:600;color:var(--accent);background:#fff;border:1px solid var(--accent);border-radius:10px;padding:12px 16px;cursor:pointer}
  .btn-zip:hover{background:var(--accent);color:#fff}
  .choices{display:grid;gap:10px}
  .field-note{font-size:12.5px;color:var(--ink-soft);margin:0 0 12px;display:flex;gap:8px;align-items:center}
  .day{margin:0 0 16px}
  .day-name{font-family:"Yu Mincho",serif;font-size:16px;font-weight:600;margin:0 0 8px;padding-left:10px;border-left:2px solid var(--accent-2)}
  .times{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .choice{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fffdf9;border-radius:10px;padding:12px 14px;cursor:pointer;transition:border-color .15s,background .15s}
  .choice:hover{border-color:var(--accent-2)}
  .choice input{width:18px;height:18px;accent-color:var(--accent);flex:0 0 auto;margin:0}
  .choice .ct{font-size:14.5px;font-weight:600}
  .choice:has(input:checked){border-color:var(--accent);background:#fbf3f2;box-shadow:0 0 0 2px rgba(124,31,42,.08)}
  .choice.full{opacity:.45;cursor:not-allowed}
  .choice.full .ct::after{content:"　満席";font-size:12px;color:var(--ink-soft);font-weight:400}
  .slots-empty{font-size:14px;color:var(--ink-soft);background:var(--paper-2);border-radius:10px;padding:16px}
  .btn-submit{width:100%;font:inherit;font-size:16px;font-weight:600;letter-spacing:.14em;color:#fff;background:var(--accent);border:none;border-radius:12px;padding:17px;cursor:pointer}
  .btn-submit:hover{background:#651822}
  .btn-submit:disabled{opacity:.55;cursor:default}
  .form-msg{margin:14px 0 0;font-size:13.5px;text-align:center;min-height:1.2em}
  .form-msg.err{color:#fff;font-weight:700;font-size:15px;background:var(--accent);border-radius:10px;padding:14px 16px;box-shadow:0 4px 16px rgba(124,31,42,.28);animation:errshake .5s ease}
  .form-msg.err::before{content:"⚠ "}
  .form-msg.ok{color:var(--ok);font-weight:600}
  @keyframes errshake{0%,100%{transform:translateX(0)}15%{transform:translateX(-8px)}30%{transform:translateX(8px)}45%{transform:translateX(-6px)}60%{transform:translateX(6px)}75%{transform:translateX(-3px)}90%{transform:translateX(3px)}}
  .agree{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-soft);margin:0 0 20px}
  .agree input{margin-top:4px;width:17px;height:17px;accent-color:var(--accent)}
  #done{display:none;padding:70px 0 90px}
  #done h2{font-family:"Yu Mincho",serif;font-weight:600;font-size:24px;margin:0 0 12px}
  #done p{color:var(--ink-soft);font-size:14.5px}
  footer{border-top:1px solid var(--line);padding:26px 0;color:var(--ink-soft);font-size:12px}
  .fs-ctrl{position:fixed;right:14px;bottom:14px;z-index:900;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:30px;padding:7px 10px 7px 14px;box-shadow:0 4px 18px rgba(0,0,0,.14)}
  .fs-ctrl .fs-label{font-size:11.5px;color:var(--ink-soft);font-weight:600;white-space:nowrap}
  .fs-ctrl button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:20px;padding:6px 11px;font-weight:700;line-height:1}
  .fs-ctrl button.s{font-size:12px}.fs-ctrl button.m{font-size:14px}.fs-ctrl button.l{font-size:16px}
  .fs-ctrl button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  body.fs-1 header.hero,body.fs-1 main,body.fs-1 footer{zoom:1.12}
  body.fs-2 header.hero,body.fs-2 main,body.fs-2 footer{zoom:1.25}
  @media(max-width:560px){.row2{grid-template-columns:1fr}.fs-ctrl .fs-label{display:none}.times{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KG9CZ8Q4" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<header class="hero"><div class="wrap">
  <p class="eyebrow">BRIDAL RING</p>
  <h1>ブライダルリング<br>お申し込みフォーム</h1>
  <p class="lead">ご希望の日時をお選びのうえ、必要事項をご入力ください。受付後、確認のメールをお送りします。</p>
</div></header>

<main class="wrap">
  <form id="theForm" novalidate>
    <section class="step">
      <div class="step-head"><span class="step-no">STEP 1</span><h2>参加希望日時</h2></div>
      <p class="field-note"><span>ご都合のよい枠をお選びください（複数選択可）。</span><span class="req">必須</span></p>
      <div id="slots"></div>
    </section>

    <section class="step">
      <div class="step-head"><span class="step-no">STEP 2</span><h2>お客様情報</h2></div>
      <label class="field"><span class="lb">氏名 <span class="req">必須</span></span>
        <input type="text" name="name" autocomplete="name" placeholder="山田 花子" required></label>
      <label class="field"><span class="lb">郵便番号 <span class="req">必須</span></span>
        <span class="row-zip"><input type="text" name="zip" id="zip" inputmode="numeric" autocomplete="postal-code" maxlength="8" placeholder="810-0001" required>
        <button type="button" class="btn-zip" id="zipBtn">住所を自動入力</button></span>
        <span class="hint" style="display:block">7桁入力で住所が自動で入ります。</span></label>
      <label class="field"><span class="lb">住所 <span class="req">必須</span></span>
        <input type="text" name="address" id="address" autocomplete="street-address" required></label>
      <div class="row2">
        <label class="field"><span class="lb">電話番号 <span class="req">必須</span></span>
          <input type="tel" name="tel" inputmode="tel" autocomplete="tel" placeholder="090-1234-5678" required></label>
        <label class="field"><span class="lb">メールアドレス <span class="req">必須</span></span>
          <input type="email" name="email" autocomplete="email" required></label>
      </div>
      <p class="hint" style="margin-top:-8px">受付確認メールをお送りします。</p>
    </section>

    <section class="step">
      <div class="step-head"><span class="step-no">STEP 3</span><h2>ご結婚のご予定</h2></div>
      <label class="field"><span class="lb">結婚予定 <span class="req">必須</span></span>
        <select name="weddingPlan" id="weddingPlan" required><option value="">選択してください</option></select>
        <span class="hint" style="display:block">入籍・挙式のどちらか早い方の目安で構いません。</span></label>
      <label class="field"><span class="lb">特に当日相談したいこと <span class="opt">任意</span></span>
        <textarea name="note" placeholder="例：予算の目安、デザインの好み、刻印、サイズ直しなど"></textarea></label>
    </section>

    <section class="step">
      <label class="agree"><input type="checkbox" id="agree"><span>入力内容を確認し、この内容で申し込みます。</span></label>
      <button type="submit" class="btn-submit" id="submitBtn">この内容で申し込む</button>
      <p class="form-msg" id="formMsg"></p>
    </section>
  </form>

  <section id="done"><h2>お申し込みを承りました</h2><p>ご入力のメールアドレスへ受付確認メールをお送りしました。<br>担当者より改めてご連絡いたします。</p></section>
</main>

<footer class="wrap"><div>メモリード</div></footer>

<div class="fs-ctrl" role="group" aria-label="文字サイズ変更">
  <span class="fs-label">文字サイズ</span>
  <button type="button" class="s active" data-fs="0">標準</button>
  <button type="button" class="m" data-fs="1">大</button>
  <button type="button" class="l" data-fs="2">特大</button>
</div>

<script>
const CONFIG = {
  ENDPOINT: "https://memolead-bridal-ring.mk-cbe.workers.dev/submit",
  FORM_NAME: "ブライダルリング 申込フォーム",
  /* ★参加希望日時（ここだけ差し替え）。date=YYYY-MM-DD、times=時間枠、full=満席にする枠。
     過ぎた日付は自動で非表示。※下記は仮の枠（未確認）。本番の日程に差し替えてから公開する。 */
  SLOTS: [
    { date: "2026-10-10", times: ["10:00〜", "13:00〜", "15:00〜"], full: [] },
    { date: "2026-10-11", times: ["10:00〜", "13:00〜", "15:00〜"], full: [] }
  ],
  /* 結婚予定の選択肢：今月から何か月先まで出すか */
  PLAN_MONTHS: 24
};

/* 文字サイズ変更 */
document.querySelectorAll('.fs-ctrl button').forEach(btn=>btn.addEventListener("click",()=>{
  const lv=+btn.dataset.fs; document.body.classList.remove("fs-1","fs-2");
  if(lv===1)document.body.classList.add("fs-1"); else if(lv===2)document.body.classList.add("fs-2");
  document.querySelectorAll('.fs-ctrl button').forEach(b=>b.classList.toggle("active",b===btn));
}));

/* 参加希望日時（チェックボックス） */
const WD=["日","月","火","水","木","金","土"];
const slotsEl=document.getElementById("slots");
(function renderSlots(){
  const today=new Date(); today.setHours(0,0,0,0);
  const days=CONFIG.SLOTS.filter(s=>new Date(s.date+"T00:00:00")>=today);
  if(!days.length){slotsEl.innerHTML='<p class="slots-empty">現在受付中の日程はありません。</p>';return;}
  slotsEl.innerHTML=days.map(s=>{
    const dt=new Date(s.date+"T00:00:00");
    const dl=`${dt.getMonth()+1}月${dt.getDate()}日（${WD[dt.getDay()]}）`;
    const t=s.times.map(tm=>{
      const full=(s.full||[]).includes(tm), v=`${dt.getFullYear()}年${dl} ${tm}`;
      return `<label class="choice${full?" full":""}"><input type="checkbox" name="slots" value="${v}"${full?" disabled":""}><span class="ct">${tm}</span></label>`;
    }).join("");
    return `<div class="day"><p class="day-name">${dl}</p><div class="times">${t}</div></div>`;
  }).join("");
})();

/* 結婚予定（年月＋未定） */
(function renderPlan(){
  const sel=document.getElementById("weddingPlan"), d=new Date(); d.setDate(1);
  for(let i=0;i<CONFIG.PLAN_MONTHS;i++){
    const o=document.createElement("option"); o.value=o.textContent=`${d.getFullYear()}年${d.getMonth()+1}月`;
    sel.appendChild(o); d.setMonth(d.getMonth()+1);
  }
  const later=document.createElement("option"); later.value=later.textContent=`${d.getFullYear()}年${d.getMonth()+1}月以降`; sel.appendChild(later);
  const u=document.createElement("option"); u.value=u.textContent="未定"; sel.appendChild(u);
})();

/* 郵便番号→住所（zipcloud JSONP。fetchはCORSで失敗） */
const zip=document.getElementById("zip"), zipBtn=document.getElementById("zipBtn"), addr=document.getElementById("address");
let zipReqId=0;
function lookupZip(){
  const code=zip.value.replace(/[^0-9]/g,"");
  if(code.length!==7){setMsg("郵便番号は7桁でご入力ください。","err");return;}
  zipBtn.disabled=true;zipBtn.textContent="検索中…";
  const cb="__zipcb"+(++zipReqId); let s=null;
  const cleanup=()=>{try{delete window[cb];}catch(_){window[cb]=undefined;} if(s&&s.parentNode)s.parentNode.removeChild(s); zipBtn.disabled=false;zipBtn.textContent="住所を自動入力";};
  const timer=setTimeout(()=>{setMsg("住所の取得に失敗しました。手入力でお願いします。","err");cleanup();},8000);
  window[cb]=function(res){clearTimeout(timer);
    if(res&&res.results&&res.results[0]){const a=res.results[0];addr.value=`${a.address1}${a.address2}${a.address3}`;addr.focus();setMsg("住所を反映しました。番地・建物名をご入力ください。","ok");}
    else setMsg("該当する住所が見つかりませんでした。手入力でお願いします。","err");
    cleanup();};
  s=document.createElement("script");
  s.src=`https://zipcloud.ibsnet.co.jp/api/search?zipcode=${code}&callback=${cb}`;
  s.onerror=()=>{clearTimeout(timer);setMsg("住所の取得に失敗しました。手入力でお願いします。","err");cleanup();};
  document.body.appendChild(s);
}
zipBtn.addEventListener("click",lookupZip);
zip.addEventListener("input",()=>{ if(zip.value.replace(/[^0-9]/g,"").length===7) lookupZip(); });

/* 送信 */
const form=document.getElementById("theForm"), msg=document.getElementById("formMsg"), submitBtn=document.getElementById("submitBtn");
function setMsg(t,cls){msg.textContent=t;msg.className="form-msg"+(cls?" "+cls:""); if(cls==="err"){msg.style.animation="none";void msg.offsetWidth;msg.style.animation="";msg.scrollIntoView({behavior:"smooth",block:"center"});}}
form.addEventListener("submit",async e=>{
  e.preventDefault(); setMsg("","");
  const fd=new FormData(form), g=k=>(fd.get(k)||"").toString().trim();
  const d={name:g("name"),zip:g("zip"),address:g("address"),tel:g("tel"),email:g("email"),
    slots:fd.getAll("slots").join("\n"),weddingPlan:g("weddingPlan"),note:g("note"),
    formName:CONFIG.FORM_NAME,source:location.href};
  if(!d.slots){setMsg("参加希望日時を1つ以上お選びください。","err");return;}
  if(!d.name||!d.zip||!d.address||!d.tel||!d.email){setMsg("必須項目をご入力ください。","err");return;}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)){setMsg("メールアドレスの形式をご確認ください。","err");return;}
  if(!d.weddingPlan){setMsg("結婚予定をお選びください。","err");return;}
  if(!document.getElementById("agree").checked){setMsg("確認のチェックを入れてください。","err");return;}
  submitBtn.disabled=true;submitBtn.textContent="送信中…";
  try{
    const r=await fetch(CONFIG.ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});
    if(!r.ok)throw new Error("status "+r.status);
    (window.dataLayer=window.dataLayer||[]).push({event:"bridal_ring_submit",form_name:CONFIG.FORM_NAME,wedding_plan:d.weddingPlan});
    form.style.display="none";document.getElementById("done").style.display="block";document.getElementById("done").scrollIntoView({behavior:"smooth"});
  }catch(_){setMsg("送信に失敗しました。時間をおいて再度お試しください。","err");submitBtn.disabled=false;submitBtn.textContent="この内容で申し込む";}
});
</script>
</body>
</html>
