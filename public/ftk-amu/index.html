<section class="entry" id="form"><div class="wrap">
  <h2>応募フォーム</h2>
  <p class="lead">入力は4項目、30秒で完了します。</p>

  <form id="theForm" novalidate>
    <div class="field">
      <p class="lb">応募するプレゼント <span class="req">必須</span></p>
      <div class="plans">
        <label class="plan"><input type="radio" name="plan" value="wedding"><span><span class="tag">抽選20組</span><span class="pt">前撮り or ロケーションフォト付き<br>結婚式プレゼント</span></span></label>
        <label class="plan"><input type="radio" name="plan" value="public"><span><span class="tag">抽選1組</span><span class="pt">アミュひろばでの<br>公開挙式プレゼント</span></span></label>
        <label class="plan"><input type="radio" name="plan" value="both"><span><span class="pt">両方に応募する</span></span></label>
      </div>
    </div>

    <label class="field"><span class="lb">お名前 <span class="req">必須</span></span>
      <input type="text" name="name" autocomplete="name" maxlength="50" placeholder="熊本 花子" required></label>

    <label class="field"><span class="lb">電話番号 <span class="req">必須</span></span>
      <input type="tel" name="tel" inputmode="tel" autocomplete="tel" maxlength="13" placeholder="090-1234-5678" required>
      <span class="hint">当選した場合、担当者からお電話します。</span></label>

    <label class="agree"><input type="checkbox" id="agree"><span><a href="#" id="privacyLink" target="_blank" rel="noopener">プライバシーポリシー</a>に同意する</span></label>
    <button type="submit" class="btn-submit" id="submitBtn">この内容で応募する</button>
    <p class="ticket-note">※アミュプラザくまもと ショッピングチケットは、応募者全員が抽選の対象です。</p>
    <p class="form-msg" id="formMsg"></p>
  </form>

  <section id="done" tabindex="-1">
    <h3>ご応募ありがとうございました</h3>
    <p>当選された方には、担当者からお電話でご連絡します。</p>
    <p>当選の発表は、当選された方へのご連絡をもってかえさせていただきます。</p>
  </section>
