<meta name="description" content="アミュプラザくまもと リニューアルキャンペーン企画。前撮り or ロケーションフォト付きの結婚式、アミュひろばでの公開挙式、ショッピングチケットが抽選で当たります。応募は30秒。">

<body>

<section class="entry" id="form"><div class="wrap">
  <div class="fbox">
    <h2 class="fbox-title">応募フォーム</h2>
    <div class="fbox-in">
      <div class="steps" aria-hidden="true">
        <span class="steps-lb">STEP</span>
        <span class="steps-no is-on" data-step-no="1">1</span>
        <span class="steps-no" data-step-no="2">2</span>
        <span class="steps-note">カンタン30秒！</span>
      </div>

      <form id="theForm" novalidate>
        <div class="panel" data-panel="1">
          <p class="lb">ご希望のプラン <span class="req">必須</span></p>
          <div class="plans">
            <label class="plan"><input type="radio" name="plan" value="wedding">
              <span class="plan-img"><img src="./_assets/img/plan-wedding.jpg" alt="" width="600" height="400" loading="lazy"></span>
              <span class="plan-tag">抽選20組</span>
              <span class="plan-tt"><span class="ib">前撮り or</span> <span class="ib">ロケーション</span><span class="ib">フォト付き</span><br><span class="ib">結婚式</span><span class="ib">プレゼント</span></span></label>
            <label class="plan"><input type="radio" name="plan" value="public">
              <span class="plan-img"><img src="./_assets/img/plan-public.jpg" alt="" width="600" height="400" loading="lazy"></span>
              <span class="plan-tag">抽選1組</span>
              <span class="plan-tt"><span class="ib">アミュひろばでの</span><br><span class="ib">公開挙式</span><span class="ib">プレゼント</span></span></label>
            <label class="plan plan--both"><input type="radio" name="plan" value="both">
              <span class="plan-tt">両方に応募する</span></label>
          </div>
          <p class="ticket-note">※アミュプラザくまもと ショッピングチケットは、応募者全員が抽選の対象です。</p>
          <div class="btns"><button type="button" class="btn btn-main" id="nextBtn">進む</button></div>
        </div>

        <div class="panel" data-panel="2" hidden>
          <p class="picked">ご希望のプラン：<b id="pickedPlan"></b></p>
          <label class="field"><span class="lb">お名前 <span class="req">必須</span></span>
            <input type="text" name="name" autocomplete="name" maxlength="50" placeholder="例）熊本 花子" required></label>
          <label class="field"><span class="lb">連絡先電話番号 <span class="req">必須</span></span>
            <input type="tel" name="tel" inputmode="tel" autocomplete="tel" maxlength="13" placeholder="例）090-1234-5678" required>
            <span class="hint">当選した場合、担当者からお電話します。</span></label>
          <label class="agree"><input type="checkbox" id="agree"><span><a href="#" id="privacyLink" target="_blank" rel="noopener">プライバシーポリシー</a>に同意する</span></label>
          <div class="btns btns--two">
            <button type="button" class="btn btn-back" id="backBtn">戻る</button>
            <button type="submit" class="btn btn-main" id="submitBtn">送信</button>
          </div>
        </div>
        <p class="form-msg" id="formMsg"></p>
      </form>

      <section id="done" tabindex="-1">
        <h3>ご応募ありがとうございました</h3>
        <p>当選された方には、〔○月○日〕頃までにザ・フォレストテラス熊本の担当者からお電話でご連絡します。</p>
        <p>お電話は〔0XX-XXX-XXXX〕からおかけします。</p>
        <p>当選の発表は、当選された方へのご連絡をもってかえさせていただきます。</p>
      </section>
    </div>
  </div>
</div></section>
