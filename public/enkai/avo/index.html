<style>
:root{
  --paper:#f6f2ea; --paper-2:#efe8db; --ink:#1a1714; --ink-soft:#4a423a;
  --line:#dacfbb;
  --accent:#7c1f2a; --accent-2:#a8894e;
  --serif:"Yu Mincho","YuMincho","Hiragino Mincho ProN","Hiragino Mincho Pro",serif;
  --sans:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","YuGothic","Meiryo",sans-serif;
  --wrap:1120px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-feature-settings:"palt"; line-height:1.9;
  font-size:16px; letter-spacing:.02em; -webkit-font-smoothing:antialiased;
}
img{max-width:100%; display:block}
a{color:inherit}
.wrap{max-width:var(--wrap); margin:0 auto; padding:0 24px}
.serif{font-family:var(--serif)}
.en{font-family:"Cormorant Garamond",var(--serif); letter-spacing:.28em; text-transform:uppercase; font-size:12px; color:var(--accent-2); font-weight:600}
.br-sp{display:none}

/* header */
header{position:fixed; top:0; left:0; right:0; z-index:50; transition:.4s; padding:18px 0}
header .bar{display:flex; align-items:center; justify-content:space-between}
header .site{font-family:var(--serif); font-size:17px; letter-spacing:.14em; color:#fff; transition:.4s}
header .site small{display:block; font-size:9.5px; letter-spacing:.32em; color:var(--accent-2); margin-top:3px; font-family:var(--sans)}
header .nav{display:flex; align-items:center; gap:22px}
header .nav a.tel{font-family:var(--serif); font-size:20px; letter-spacing:.06em; color:#fff; transition:.4s; text-decoration:none}
header .nav a.tel span{font-size:10px; letter-spacing:.2em; display:block; font-family:var(--sans); color:var(--accent-2)}
header .nav a.cta{background:var(--accent); color:#fff; text-decoration:none; padding:12px 22px; font-size:13px; letter-spacing:.16em; border-radius:1px}
header.scrolled{background:var(--paper); box-shadow:0 1px 0 var(--line); padding:12px 0}
header.scrolled .site,header.scrolled .nav a.tel{color:var(--ink)}
header .nav a.tel .num{color:inherit}

/* hero */
.hero{position:relative; min-height:100svh; display:flex; align-items:flex-end; overflow:hidden}
.hero .bg{position:absolute; inset:0; background:#111}
.hero .bg img{width:100%; height:100%; object-fit:cover; opacity:.86}
.hero .bg::after{content:""; position:absolute; inset:0;
  background:linear-gradient(180deg,rgba(15,12,10,.55) 0%,rgba(15,12,10,.15) 32%,rgba(15,12,10,.15) 55%,rgba(15,12,10,.82) 100%)}
.hero .inner{position:relative; z-index:2; color:#fff; padding-bottom:9vh; width:100%}
.hero .season{display:inline-block; border:1px solid rgba(255,255,255,.5); padding:7px 16px; font-size:12px; letter-spacing:.18em; margin-bottom:26px}
.hero h1{font-family:var(--serif); font-weight:500; font-size:clamp(38px,6.4vw,76px); line-height:1.16; margin:0 0 22px; letter-spacing:.04em; text-shadow:0 2px 24px rgba(0,0,0,.3)}
.hero h1 .thin{display:block; font-size:.26em; letter-spacing:.24em; color:var(--accent-2); margin-bottom:18px; font-weight:600; font-family:"Cormorant Garamond",var(--serif)}
.hero p.lead{font-size:clamp(15px,1.7vw,18px); max-width:33em; line-height:2.05; margin:0 0 34px; text-shadow:0 1px 12px rgba(0,0,0,.4)}
.hero .acts{display:flex; gap:16px; flex-wrap:wrap; align-items:center}
.hero .acts a{text-decoration:none}
.hero .acts .tel{color:#fff}
.hero .acts .tel .num{font-family:var(--serif); font-size:30px; letter-spacing:.05em}
.hero .acts .tel small{display:block; font-size:11px; letter-spacing:.22em; color:rgba(255,255,255,.75)}
.hero .acts .cta{background:var(--accent); color:#fff; padding:17px 34px; font-size:14px; letter-spacing:.16em; border-radius:1px; transition:.3s}
.hero .acts .cta:hover{background:#651821}

/* section shell */
section{position:relative}
.pad{padding:96px 0}
.pad-lg{padding:120px 0}
.eyebrow{display:flex; align-items:center; gap:16px; margin-bottom:20px}
.eyebrow::before{content:""; width:38px; height:1px; background:var(--accent-2)}
.h2{font-family:var(--serif); font-weight:500; font-size:clamp(27px,3.6vw,40px); line-height:1.4; margin:0 0 26px; letter-spacing:.03em}
.h2 .accent{color:var(--accent)}
.lead-txt{font-size:16.5px; line-height:2.15; color:var(--ink-soft); max-width:40em}

/* intro split */
.intro{background:var(--paper)}
.split{display:grid; grid-template-columns:1.05fr .95fr; gap:64px; align-items:center}
.split .fig{position:relative}
.split .fig img{width:100%; aspect-ratio:4/3; object-fit:cover}
.split .fig .cap{position:absolute; bottom:-18px; left:-18px; background:var(--accent); color:#fff; font-family:var(--serif); padding:16px 22px; font-size:15px; letter-spacing:.08em}

/* perks */
.perks{background:var(--ink); color:#f3ece0}
.perks .h2{color:#fff}
.perks .lead-txt{color:#cbbfae}
.perk-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.12); margin-top:44px}
.perk{background:var(--ink); padding:38px 26px}
.perk .no{font-family:var(--serif); font-size:14px; letter-spacing:.2em; color:var(--accent-2); margin-bottom:18px}
.perk h3{font-family:var(--serif); font-size:20px; font-weight:500; margin:0 0 12px; line-height:1.5; color:#fff}
.perk p{font-size:13px; line-height:1.9; color:#bcb1a0; margin:0}
.perk .price{color:var(--accent-2); font-family:var(--serif)}
.perk-note{margin-top:22px; font-size:12.5px; color:#9c9182; line-height:1.9}

/* plans */
.plans{background:var(--paper-2)}
.plan-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:30px; margin-top:52px}
.plan{background:#fff; border:1px solid var(--line); display:flex; flex-direction:column}
.plan .ph{aspect-ratio:3/2; overflow:hidden}
.plan .ph img{width:100%; height:100%; object-fit:cover; transition:.6s}
.plan:hover .ph img{transform:scale(1.04)}
.plan .body{padding:30px 26px 32px; display:flex; flex-direction:column; flex:1}
.plan .style{font-size:11px; letter-spacing:.2em; color:var(--accent); margin-bottom:12px}
.plan h3{font-family:var(--serif); font-weight:500; font-size:25px; margin:0 0 6px; letter-spacing:.04em}
.plan .sub{font-size:13px; color:var(--ink-soft); margin:0 0 22px; min-height:2.4em; line-height:1.8}
.plan .tiers{display:flex; gap:8px; padding:16px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); margin-bottom:20px}
.plan .tiers .t{flex:1; text-align:center}
.plan .tiers .t b{display:block; font-family:var(--serif); font-size:21px; color:var(--accent); letter-spacing:.02em}
.plan .tiers .t span{font-size:10px; color:#8c8272; letter-spacing:.06em}
.plan .taxnote{font-size:11px; color:#8c8272; text-align:center; margin:-12px 0 20px}
.plan .menu-h{font-size:12px; letter-spacing:.14em; color:var(--accent-2); margin-bottom:12px; font-weight:600}
.plan ul{list-style:none; margin:0; padding:0; flex:1}
.plan ul li{font-size:13.5px; line-height:1.75; padding:7px 0 7px 18px; position:relative; border-bottom:1px dotted #e4dccb; color:var(--ink-soft)}
.plan ul li::before{content:""; position:absolute; left:2px; top:14px; width:5px; height:5px; background:var(--accent-2); border-radius:50%}
.plans .foot-note{margin-top:34px; font-size:13px; color:var(--ink-soft); line-height:1.95}
.plans .foot-note .wa{display:inline-block; font-family:var(--serif); color:var(--accent); font-size:16px; margin-bottom:6px}
.plans .foot-note a{color:var(--accent); text-decoration:none; border-bottom:1px solid var(--accent-2); padding-bottom:1px}
/* benefits band (light) */
.benefit-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin:40px 0 6px}
.benefit{background:#fff; border:1px solid var(--line); border-top:3px solid var(--accent); padding:24px 22px}
.benefit .no{font-family:var(--serif); font-size:13px; letter-spacing:.18em; color:var(--accent-2); margin-bottom:12px}
.benefit h4{font-family:var(--serif); font-weight:500; font-size:17px; margin:0 0 9px; line-height:1.5}
.benefit p{font-size:12.5px; line-height:1.85; color:var(--ink-soft); margin:0}
.benefit p .price{color:var(--accent); font-family:var(--serif)}
.benefit .gift{color:var(--accent); font-weight:700}
.plans-sub{font-family:var(--serif); font-weight:500; font-size:22px; letter-spacing:.03em; margin:54px 0 2px; display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.plans-sub small{font-family:var(--sans); font-size:12.5px; letter-spacing:.02em; color:var(--ink-soft)}
.plans-sub::before{content:""; width:26px; height:1px; background:var(--accent-2)}
/* price bar (compact, shared-menu plan) */
.pricebar{display:grid; grid-template-columns:repeat(3,1fr); gap:24px; margin-top:30px}
.pricecard{background:#fff; border:1px solid var(--line); padding:30px 26px; text-align:center}
.pricecard .st{font-size:11px; letter-spacing:.18em; color:var(--accent); margin-bottom:10px}
.pricecard h4{font-family:var(--serif); font-weight:500; font-size:23px; margin:0 0 6px; letter-spacing:.03em}
.pricecard .sub{font-size:12.5px; color:var(--ink-soft); line-height:1.7; margin:0 0 18px; min-height:3.4em}
.pricecard .prow{display:flex; justify-content:center; gap:14px; border-top:1px solid var(--line); padding-top:16px}
.pricecard .prow div b{display:block; font-family:var(--serif); font-size:19px; color:var(--accent)}
.pricecard .prow div span{font-size:10px; color:#8c8272; letter-spacing:.05em}

/* drink */
.drink{background:var(--ink); color:#f0e9dd}
.drink .h2{color:#fff}
.drink .dwrap{display:grid; grid-template-columns:.8fr 1.2fr; gap:52px; align-items:center; margin-top:20px}
.drink .tags{display:flex; flex-wrap:wrap; gap:10px}
.drink .tags span{border:1px solid rgba(255,255,255,.28); padding:9px 16px; font-size:13px; letter-spacing:.04em; color:#e7ddcd}
.drink .up{margin-top:26px; font-size:13.5px; color:#cbbfae; line-height:1.9}
.drink .up b{color:var(--accent-2); font-family:var(--serif); font-size:15px}

/* rooms */
.rooms{background:var(--paper)}
.room-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:20px; margin-top:48px}
.room{position:relative; overflow:hidden; background:#000}
.room img{width:100%; aspect-ratio:3/4; object-fit:cover; opacity:.9; transition:.6s}
.room:hover img{transform:scale(1.05); opacity:1}
.room .lab{position:absolute; left:0; bottom:0; right:0; padding:22px 20px; color:#fff;
  background:linear-gradient(0deg,rgba(0,0,0,.78),transparent)}
.room .lab b{display:block; font-family:var(--serif); font-size:19px; letter-spacing:.06em; margin-bottom:4px}
.room .lab span{font-size:12px; color:var(--accent-2); letter-spacing:.08em}
.rooms .rn{margin-top:26px; font-size:13px; color:var(--ink-soft); line-height:1.9}

/* houji */
.houji{background:#20201d; color:#ece5d8}
.houji .split{gap:56px}
.houji .h2{color:#fff}
.houji .lead-txt{color:#c7bcac}
.houji .fig img{aspect-ratio:4/5}
.houji .courses{margin-top:30px; border-top:1px solid rgba(255,255,255,.16)}
.houji .courses .row{display:flex; justify-content:space-between; align-items:baseline; padding:20px 0; border-bottom:1px solid rgba(255,255,255,.16)}
.houji .courses .row b{font-family:var(--serif); font-size:18px; letter-spacing:.05em; color:#fff; font-weight:500}
.houji .courses .row .p{font-family:var(--serif); font-size:24px; color:var(--accent-2)}
.houji .courses .row .p small{font-size:13px; color:#b3a898}
.houji .drinkline{margin-top:18px; font-size:14px; color:#cbbfae}
.houji .drinkline b{color:var(--accent-2); font-family:var(--serif); font-size:17px}
.houji .rn{margin-top:22px; font-size:12px; color:#9d9384; line-height:1.9}

/* occasions */
.occ{background:var(--paper-2)}
.occ-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:1px; background:var(--line); border:1px solid var(--line); margin-top:50px}
.occ-item{background:var(--paper); display:grid; grid-template-columns:150px 1fr; min-height:190px}
.occ-item .im{overflow:hidden}
.occ-item .im img{width:100%; height:100%; object-fit:cover}
.occ-item .tx{padding:30px 30px}
.occ-item .en{margin-bottom:10px}
.occ-item h3{font-family:var(--serif); font-weight:500; font-size:21px; margin:0 0 14px; letter-spacing:.04em}
.occ-item .tags{display:flex; flex-wrap:wrap; gap:8px 10px}
.occ-item .tags span{font-size:12.5px; color:var(--ink-soft); padding:4px 0; position:relative}
.occ-item .tags span:not(:last-child)::after{content:"／"; color:var(--line); margin-left:10px}

/* business */
.biz{position:relative; color:#fff; overflow:hidden}
.biz .bg{position:absolute; inset:0}
.biz .bg img{width:100%; height:100%; object-fit:cover}
.biz .bg::after{content:""; position:absolute; inset:0; background:rgba(18,15,12,.72)}
.biz .inner{position:relative; z-index:2}
.biz .h2{color:#fff}
.biz .cols{display:grid; grid-template-columns:1fr 1fr; gap:44px; margin-top:44px}
.biz .col{border-top:2px solid var(--accent-2); padding-top:24px}
.biz .col h3{font-family:var(--serif); font-weight:500; font-size:22px; margin:0 0 14px}
.biz .col p{font-size:14px; line-height:2; color:#d8cfc0; margin:0}

/* form */
.formsec{background:var(--paper)}
.formsec .head{text-align:center; margin-bottom:12px}
.formsec .eyebrow{justify-content:center}
.formsec .eyebrow::before{display:none}
.formsec .lead-txt{margin:0 auto; text-align:center}
.formcard{max-width:820px; margin:48px auto 0; background:#fff; border:1px solid var(--line); padding:52px 54px}
.formcard .telrow{text-align:center; padding:0 0 34px; margin-bottom:36px; border-bottom:1px solid var(--line)}
.formcard .telrow .lb{font-size:13px; letter-spacing:.14em; color:var(--ink-soft); margin-bottom:8px}
.formcard .telrow a{font-family:var(--serif); font-size:38px; color:var(--accent); text-decoration:none; letter-spacing:.05em}
.formcard .telrow .hours{font-size:12px; color:#8c8272; margin-top:6px}
.field{margin-bottom:24px}
.field label{display:block; font-size:14px; letter-spacing:.05em; margin-bottom:9px; font-weight:600}
.field label .req{color:#fff; background:var(--accent); font-size:10px; padding:2px 7px; margin-left:8px; letter-spacing:.1em; border-radius:1px; vertical-align:2px}
.field label .opt{color:#8c8272; background:var(--paper-2); font-size:10px; padding:2px 7px; margin-left:8px; letter-spacing:.1em; border-radius:1px; vertical-align:2px}
.field input,.field select,.field textarea{width:100%; font-family:var(--sans); font-size:16px; padding:14px 15px; border:1px solid #cfc4b1; background:var(--paper); border-radius:2px; color:var(--ink)}
.field input:focus,.field select,.field textarea:focus{outline:none; border-color:var(--accent)}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:20px}
.row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:20px}
.zip-wrap{display:flex; gap:10px}
.zip-wrap input{flex:1}
.zip-wrap button{white-space:nowrap; border:1px solid var(--accent); background:#fff; color:var(--accent); padding:0 18px; font-size:13px; border-radius:2px; cursor:pointer}
.choices{display:flex; flex-wrap:wrap; gap:10px}
.choice{position:relative; cursor:pointer}
.choice input{position:absolute; opacity:0; inset:0; cursor:pointer}
.choice span{display:block; border:1px solid #cfc4b1; padding:11px 18px; font-size:14px; border-radius:2px; transition:.2s; background:var(--paper)}
.choice input:checked+span{background:var(--accent); color:#fff; border-color:var(--accent)}
.field .hint{font-size:12px; color:#8c8272; margin-top:7px}
.err-msg{display:none; background:var(--accent); color:#fff; font-weight:700; padding:12px 16px; border-radius:2px; margin-bottom:20px; font-size:14px}
.err-msg::before{content:"⚠ "; }
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--accent); background:#fbeef0}
.submit{width:100%; background:var(--accent); color:#fff; border:none; padding:20px; font-size:16px; letter-spacing:.16em; font-family:var(--serif); cursor:pointer; border-radius:2px; transition:.3s}
.submit:hover{background:#651821}
.submit:disabled{opacity:.6; cursor:wait}
.privacy{font-size:12px; color:#8c8272; text-align:center; margin-top:18px; line-height:1.8}
.done{display:none; text-align:center; padding:40px 10px}
.done .mk{font-family:var(--serif); font-size:26px; color:var(--accent); margin-bottom:18px}
.done p{color:var(--ink-soft); line-height:2}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

/* access */
.access{background:var(--ink); color:#ece5d8}
.access .awrap{display:grid; grid-template-columns:1fr 1fr; gap:56px; align-items:center}
.access .h2{color:#fff}
.access .info{font-size:15px; line-height:1.6}
.access .info dl{display:grid; grid-template-columns:96px 1fr; gap:0; margin:0}
.access .info dt{font-family:var(--serif); color:var(--accent-2); padding:14px 0; border-bottom:1px solid rgba(255,255,255,.14); letter-spacing:.08em}
.access .info dd{margin:0; padding:14px 0; border-bottom:1px solid rgba(255,255,255,.14); color:#ddd3c3}
.access .info dd a{color:#ddd3c3}
.access .maplink{display:inline-block; margin-top:26px; border:1px solid var(--accent-2); color:var(--accent-2); padding:13px 26px; text-decoration:none; font-size:13px; letter-spacing:.12em}
.access .mapfig img{width:100%; aspect-ratio:1/1; object-fit:cover}

/* footer */
footer{background:#141210; color:#8c8272; text-align:center; padding:48px 0 40px}
footer .site{font-family:var(--serif); font-size:18px; letter-spacing:.14em; color:#e7ddcd; margin-bottom:10px}
footer .site small{display:block; font-size:9.5px; letter-spacing:.3em; color:var(--accent-2); margin-top:6px}
footer .cp{font-size:11px; letter-spacing:.06em; margin-top:22px; color:#6c6355}

/* floating SP cta */
.spbar{display:none}

@media(max-width:900px){
  .split,.drink .dwrap,.access .awrap{grid-template-columns:1fr; gap:38px}
  .perk-grid{grid-template-columns:repeat(2,1fr)}
  .plan-grid{grid-template-columns:1fr; max-width:440px; margin-left:auto; margin-right:auto}
  .benefit-grid{grid-template-columns:repeat(2,1fr)}
  .pricebar{grid-template-columns:1fr; max-width:440px; margin-left:auto; margin-right:auto}
  .room-grid{grid-template-columns:repeat(2,1fr)}
  .occ-grid{grid-template-columns:1fr}
  .biz .cols{grid-template-columns:1fr; gap:30px}
  .split .fig .cap{left:16px; bottom:-14px}
}
@media(max-width:768px){
  .br-sp{display:inline}
  .pad,.pad-lg{padding:70px 0}
  header .nav a.cta{display:none}
  header .nav a.tel{font-size:16px}
  header .site{font-size:15px}
  .hero{min-height:92svh}
  .hero .acts{flex-direction:column; align-items:flex-start; gap:20px}
  .formcard{padding:34px 22px}
  .formcard .telrow a{font-size:30px}
  .row2,.row3{grid-template-columns:1fr}
  .occ-item{grid-template-columns:110px 1fr}
  .access .info dl{grid-template-columns:80px 1fr}
  body{padding-bottom:64px}
  .spbar{display:flex; position:fixed; bottom:0; left:0; right:0; z-index:60; box-shadow:0 -2px 14px rgba(0,0,0,.15)}
  .spbar a{flex:1; text-align:center; padding:16px 0; text-decoration:none; font-size:14px; letter-spacing:.1em; color:#fff}
  .spbar a.tel{background:var(--ink)}
  .spbar a.cta{background:var(--accent)}
}
</style>
