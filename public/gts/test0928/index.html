<script>
(function () {
  // --- 1. 必要な要素を取得 ---
  var survey = document.getElementById('survey');
  var apply  = document.getElementById('apply');
  var btn    = document.getElementById('to-apply');
  var note   = document.getElementById('survey-note');

 
  if (!survey || !apply || !btn || !note) return;

  
  var questions = ['field_6400773', 'field_6400784', 'field_6400793'];

  // --- 2. 判定用の関数 ---
  
  function isAnswered(name) {
	return survey.querySelector('input[name="' + name + '"]:checked') !== null;
  }

  
  function allAnswered() {
	return questions.every(isAnswered);
  }

  // --- 3. ボタンの状態を更新 ---
  function updateButton() {
	var done = allAnswered();
	btn.disabled = !done;
	note.textContent = done ? '' : 'すべての質問にお答えいただくと、応募フォームに進めます';
  }

  // --- 4. 応募フォームを開く ---
  function openApply(shouldScroll) {
	apply.hidden = false;
	btn.hidden = true;
	note.textContent = '';

	if (shouldScroll) {
	  
	  apply.scrollIntoView({ behavior: 'smooth', block: 'start' });
	  
	  var first = apply.querySelector('select, input, textarea');
	  if (first) first.focus({ preventScroll: true });
	}
  }

  
  apply.hidden = true;
  btn.hidden = false;
  updateButton();

  
  survey.addEventListener('change', updateButton);


  btn.addEventListener('click', function () {
	if (!allAnswered()) return;
	openApply(true);

	
	if (typeof gtag === 'function') {
	  gtag('event', 'survey_complete');
	}
  });

  
  window.addEventListener('pageshow', function () {
	if (allAnswered()) {
	  openApply(false);
	} else {
	  updateButton();
	}
  });
})();
</script>
