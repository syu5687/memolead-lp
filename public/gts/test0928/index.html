<style>
	main{

		color: #fff;
	}

	#survey,
	#apply {
	  --form-accent: #8a6d4b;
	  --form-border: #d9d4cc;
	  --form-bg-checked: #f7f2ea;
	}

	  display: grid;

	  display: flex;
	  align-items: center;
	  gap: 10px;

	  border: 1px solid var(--form-border);

	  cursor: pointer;
	  line-height: 1.4;
	}
	
	.choices label:has(input:checked) {
	  border-color: var(--form-accent);
	  background: var(--form-bg-checked);
	  font-weight: bold;
	}
	
	.choices input[type="radio"] {
	  width: 20px;
	  height: 20px;

	#apply input[type="text"],
	#apply select,
	#apply textarea {
	  font-size: 16px;
	  padding: 10px;
	  border: 1px solid #d9d4cc;
	  border-radius: 6px;
	  max-width: 100%;
	  box-sizing: border-box;
	}
	
	#apply input[name="field_6400764_sei"],
	#apply input[name="field_6400764_mei"] {
	  width: 8em;
	}
	
	#apply input[name="field_6400769"],
	#apply input[name="field_6400765"],
	#apply select,
	#apply textarea {
	  width: 100%;
	}
	
	#to-apply {
	  display: block;
	  width: 100%;
	  max-width: 400px;
	  min-height: 52px;
	  margin: 8px auto 0;
	  border: none;
	  border-radius: 6px;
	  background: #8a6d4b;
	  color: #fff;
	  font-size: 17px;
	  font-weight: bold;
	  cursor: pointer;
	}
	
	#to-apply:disabled {
	  background: #cfc8bd;
	  cursor: not-allowed;
	}
	
	#to-apply:focus-visible {
	  outline: 3px solid #8a6d4b;
	  outline-offset: 3px;
	}

	  text-align: center;
	  font-size: 14px;
	  color: #6b6358;
	}
</style>
<script>
(function () {
  // --- 1. 必要な要素を取得 ---
  var survey = document.getElementById('survey');
  var apply  = document.getElementById('apply');
  var btn    = document.getElementById('to-apply');
  var note   = document.getElementById('survey-note');

 
  if (!survey || !apply || !btn || !note) return;

  
  var questions = ['field_6400773', 'field_6400784', 'field_6400793'];

  // --- 2. 判定用の関数 ---
  
  function isAnswered(name) {
	return survey.querySelector('input[name="' + name + '"]:checked') !== null;
  }

  
  function allAnswered() {
	return questions.every(isAnswered);
  }

  // --- 3. ボタンの状態を更新 ---
  function updateButton() {
	var done = allAnswered();
	btn.disabled = !done;
	note.textContent = done ? '' : 'すべての質問にお答えいただくと、応募フォームに進めます';
  }

  // --- 4. 応募フォームを開く ---
  function openApply(shouldScroll) {
	apply.hidden = false;
	btn.hidden = true;
	note.textContent = '';

	if (shouldScroll) {
	  
	  apply.scrollIntoView({ behavior: 'smooth', block: 'start' });
	  
	  var first = apply.querySelector('select, input, textarea');
	  if (first) first.focus({ preventScroll: true });
	}
  }

  
  apply.hidden = true;
  btn.hidden = false;
  updateButton();

  
  survey.addEventListener('change', updateButton);


  btn.addEventListener('click', function () {
	if (!allAnswered()) return;
	openApply(true);

	
	if (typeof gtag === 'function') {
	  gtag('event', 'survey_complete');
	}
  });

  
  window.addEventListener('pageshow', function () {
	if (allAnswered()) {
	  openApply(false);
	} else {
	  updateButton();
	}
  });
})();
</script>
