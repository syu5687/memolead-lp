# @version v0002 | 2026-08-07 | メモリード福岡 おせち申込フォーム Worker
name = "memolead-fukuoka-osechi"
main = "worker.js"
compatibility_date = "2026-08-01"

# 通知先・送信元は worker.js 冒頭の CONFIG で管理します（vars 不要）。
# 秘密情報は必ずシークレットで登録：
#   npx wrangler secret put BREVO_API_KEY

[[d1_databases]]
binding = "DB"
database_name = "memolead-fukuoka-osechi"
database_id = "d8d12edd-31bc-4263-9d97-99c3597bf760"

# 毎日の稼働確認メール（UTC 00:00 = 日本時間 09:00 に1回）
[triggers]
crons = ["0 0 * * *"]
