<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>おせち申込 管理画面</title>
<style>
:root{font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;color:#2d2925;background:#f6f2ea;line-height:1.6}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:24px 18px 60px}h1{font-size:25px;margin:0;color:#7c1f2a}.panel{background:#fffdf9;border:1px solid #d8cdb9;border-radius:10px;padding:20px;margin:18px 0;box-shadow:0 3px 14px #3825190b}.login{max-width:430px;margin:12vh auto}.field{display:grid;gap:6px;margin:12px 0}.field input,.field select{width:100%;font:inherit;padding:10px;border:1px solid #cfc3b1;border-radius:6px;background:#fff}.btn{font:inherit;border:0;border-radius:6px;background:#7c1f2a;color:#fff;padding:10px 18px;cursor:pointer}.btn.secondary{background:#eee7dc;color:#4d4035}.msg{color:#a51c30;font-size:13px;min-height:1.5em}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.filters{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:10px;align-items:end}.filters label{font-size:12px;font-weight:700}.filters .field{margin:0}.summary{color:#756a5e;font-size:13px;margin:15px 0}.table-wrap{overflow:auto}.orders{width:100%;border-collapse:collapse;font-size:13px;min-width:850px}.orders th,.orders td{border-bottom:1px solid #e4dbce;padding:10px 8px;text-align:left;vertical-align:top}.orders th{background:#f3eee5;white-space:nowrap}.orders tr:hover{background:#fff8ef}.status{font:inherit;border:1px solid #cfc3b1;border-radius:5px;padding:5px;background:#fff}.delete{font:inherit;border:1px solid #c98b93;border-radius:5px;padding:5px 8px;background:#fff7f7;color:#a51c30;cursor:pointer;white-space:nowrap}.detail{white-space:pre-wrap;color:#5d5146;font-size:12px;max-width:500px}.hidden{display:none!important}.danger{color:#a51c30}@media(max-width:760px){.wrap{padding:16px 12px 40px}.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.filters .wide{grid-column:1/-1}.orders{font-size:12px}}
</style>
</head>
<body>
<main class="wrap">
  <section id="login" class="panel login">
    <h1>おせち申込 管理画面</h1>
    <p>管理用パスワードを入力してください。</p>
    <form id="loginForm"><div class="field"><label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" type="submit">ログイン</button></form>
    <p id="loginMsg" class="msg"></p>
  </section>
  <section id="app" class="hidden">
    <div class="top"><h1>おせち申込 管理画面</h1><div><button id="refresh" class="btn secondary" type="button">更新</button> <button id="csv" class="btn secondary" type="button">CSV出力</button> <button id="logout" class="btn secondary" type="button">ログアウト</button></div></div>
    <section class="panel filters">
      <div class="field wide"><label for="store">店舗</label><select id="store"><option value="">全店舗（注文全一覧）</option></select></div>
      <div class="field"><label for="category">カテゴリ</label><select id="category"><option value="">すべて</option></select></div>
      <div class="field"><label for="product">商品</label><select id="product"><option value="">すべて</option></select></div>
      <div class="field"><label for="method">受取方法</label><select id="method"><option value="">すべて</option><option>店頭受け取り</option><option>福岡県内配達</option></select></div>
      <div class="field"><label for="status">対応状況</label><select id="status"><option value="">すべて</option><option>未対応</option><option>確認済み</option><option>完了</option></select></div>
      <div class="field"><label for="date">受取日</label><input id="date" type="search" placeholder="例：12/31"></div>
      <div class="field wide"><label for="query">検索（名前・電話・メール）</label><input id="query" type="search" placeholder="検索語を入力"></div>
    </section>
    <section class="panel"><div id="summary" class="summary"></div><div class="table-wrap"><table class="orders"><thead><tr><th>申込日時</th><th>お客様</th><th>店舗</th><th>商品・受取</th><th>合計</th><th>対応状況</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" class="summary hidden">該当する申込はありません。</p></section>
  </section>
</main>
<script>
const API='https://memolead-fukuoka-osechi.mk-cbe.workers.dev';let password='',all=[];
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const categoryLabels={osechi:'おせち料理',xmas:'クリスマス',nabe:'鍋セット'};
function auth(){return 'Basic '+btoa('admin:'+password)}
async function load(){const b=$('refresh');if(b)b.disabled=true;try{const r=await fetch(API+'/admin/orders',{headers:{Authorization:auth()}});if(r.status===401)throw Error('パスワードが違います。');if(!r.ok)throw Error('申込データを取得できません。');const j=await r.json();all=j.orders||[];populate();render();}finally{if(b)b.disabled=false;}}
function populate(){const stores=[...new Set(all.map(o=>o.facility).filter(Boolean))],cats=[...new Set(all.flatMap(o=>(o.orders||[]).map(x=>x.category)).filter(Boolean))],products=[...new Set(all.flatMap(o=>(o.orders||[]).flatMap(x=>(x.items||[]).map(i=>i.name))).filter(Boolean))];[['store',stores],['category',cats],['product',products]].forEach(([id,vals])=>{const s=$(id),old=s.value;s.innerHTML=s.options[0].outerHTML;vals.sort().forEach(v=>s.insertAdjacentHTML('beforeend',`<option>${esc(v)}</option>`));s.value=old;});}
function filtered(){const f={store:$('store').value,category:$('category').value,product:$('product').value,method:$('method').value,status:$('status').value,date:$('date').value.trim(),query:$('query').value.trim().toLowerCase()};return all.filter(o=>{const lines=o.orders||[];const lineMatch=lines.some(x=>(!f.category||x.category===f.category)&&(!f.product||x.items?.some(i=>i.name===f.product))&&(!f.method||x.method===f.method)&&(!f.date||String(x.pickdate||'').includes(f.date)));return (!f.store||o.facility===f.store)&&(!f.status||o.status===f.status)&&(!f.query||[o.name,o.tel,o.email].some(v=>String(v||'').toLowerCase().includes(f.query)))&&lineMatch;});}
function render(){const list=filtered();$('summary').textContent=`${list.length}件の申込（全${all.length}件）`;$('empty').classList.toggle('hidden',list.length>0);$('rows').innerHTML=list.map(o=>{const lines=(o.orders||[]).map(x=>`<div><b>${esc(x.facility||'施設未設定')}</b><br>${esc(categoryLabels[x.category]||x.category)}：${(x.items||[]).map(i=>`${esc(i.name)} × ${i.qty}`).join('、')}<br><span class="detail">${esc(x.method)}／${esc(x.pickup||'')}／${esc(x.pickdate||'')}</span></div>`).join('<hr>');const facilities=[...new Set((o.orders||[]).map(x=>x.facility).filter(Boolean))].join('<br>');return `<tr><td>${esc(new Date(o.created_at).toLocaleString('ja-JP'))}</td><td><b>${esc(o.name)}</b><br>${esc(o.zip?'〒'+o.zip:'')}<br>${esc(o.address)}<br>${esc(o.tel)}<br>${esc(o.email)}</td><td>${facilities||esc(o.facility)}</td><td>${lines}</td><td>¥${Number(o.total||0).toLocaleString('ja-JP')}</td><td><select class="status" data-id="${esc(o.id)}"><option ${o.status==='未対応'?'selected':''}>未対応</option><option ${o.status==='確認済み'?'selected':''}>確認済み</option><option ${o.status==='完了'?'selected':''}>完了</option></select></td><td><button class="delete" type="button" data-delete="${esc(o.id)}">削除</button></td></tr>`;}).join('');}
async function deleteOrder(id){const o=all.find(x=>x.id===id);if(!o||!confirm(`${o.name}様の注文を削除します。よろしいですか？`))return;const r=await fetch(API+'/admin/orders/'+encodeURIComponent(id),{method:'DELETE',headers:{Authorization:auth()}});if(!r.ok){alert('注文を削除できませんでした。');return;}all=all.filter(x=>x.id!==id);populate();render();}
async function update(id,status){const r=await fetch(API+'/admin/orders/'+encodeURIComponent(id)+'/status',{method:'POST',headers:{Authorization:auth(),'Content-Type':'application/json'},body:JSON.stringify({status})});if(!r.ok)alert('状態を更新できませんでした。');else{const o=all.find(x=>x.id===id);if(o)o.status=status;render();}}
function csv(){const rows=filtered(),head=['申込日時','名前','電話','メール','店舗','商品・受取内容','合計','対応状況'];const body=rows.map(o=>[new Date(o.created_at).toLocaleString('ja-JP'),o.name,o.tel,o.email,o.facility,(o.orders||[]).map(x=>`${x.category} ${(x.items||[]).map(i=>i.name+'×'+i.qty).join('、')} ${x.method} ${x.pickup||''} ${x.pickdate||''}`).join(' / '),o.total,o.status]);const out='\ufeff'+[head,...body].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'text/csv'}));a.download='osechi-orders.csv';a.click();URL.revokeObjectURL(a.href);}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();password=$('password').value;try{await load();$('login').classList.add('hidden');$('app').classList.remove('hidden');sessionStorage.setItem('osechiAdminSession','1');}catch(err){$('loginMsg').textContent=err.message;password='';}});$('refresh').onclick=async()=>{try{await load();}catch(err){alert(err.message)}};$('logout').onclick=()=>{password='';sessionStorage.removeItem('osechiAdminSession');location.reload()};['store','category','product','method','status','date','query'].forEach(id=>$(id).addEventListener('input',render));$('rows').addEventListener('change',e=>{if(e.target.matches('[data-id]'))update(e.target.dataset.id,e.target.value)});$('rows').addEventListener('click',e=>{if(e.target.matches('[data-delete]'))deleteOrder(e.target.dataset.delete)});$('csv').onclick=csv;
</script>
</body>
</html>
